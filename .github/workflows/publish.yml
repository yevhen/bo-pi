name: Publish package to npm

on:
  push:
    tags:
      - "bo-pi/v*"
      - "preflight/v*"
      - "macos-theme-sync/v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Resolve target package from tag
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only publishes from tags."
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          case "${TAG}" in
            bo-pi/v*)
              PACKAGE_DIR="."
              PACKAGE_LABEL="bo-pi"
              ;;
            preflight/v*)
              PACKAGE_DIR="preflight"
              PACKAGE_LABEL="preflight"
              ;;
            macos-theme-sync/v*)
              PACKAGE_DIR="macos-theme-sync"
              PACKAGE_LABEL="macos-theme-sync"
              ;;
            *)
              echo "Unsupported tag format: ${TAG}"
              exit 1
              ;;
          esac

          VERSION_FROM_TAG="${TAG#${PACKAGE_LABEL}/v}"
          PACKAGE_VERSION="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          PACKAGE_NAME="$(node -p "require('./${PACKAGE_DIR}/package.json').name")"

          echo "Tag: ${TAG}"
          echo "Package dir: ${PACKAGE_DIR}"
          echo "Package: ${PACKAGE_NAME}"
          echo "Tag version: ${VERSION_FROM_TAG}"
          echo "Package version: ${PACKAGE_VERSION}"

          if [[ "${VERSION_FROM_TAG}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag/package version mismatch."
            exit 1
          fi

          echo "package_dir=${PACKAGE_DIR}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install root dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        working-directory: ${{ steps.target.outputs.package_dir }}
        run: npm pack --dry-run

      - name: Check OIDC environment
        run: |
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "OIDC request URL is present"
          else
            echo "OIDC request URL is missing"
            exit 1
          fi

          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "OIDC request token is present"
          else
            echo "OIDC request token is missing"
            exit 1
          fi

      - name: Publish package
        working-directory: ${{ steps.target.outputs.package_dir }}
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish --access public --provenance
